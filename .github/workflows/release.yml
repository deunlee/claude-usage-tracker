name: release

on:
    push:
        tags: ['v*']

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-go@v7
              with:
                  go-version-file: go.mod
            - run: go build ./...
            - run: scripts/test.sh
            - run: scripts/build.sh
            - name: Create release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  flags=()
                  if [[ "$GITHUB_REF_NAME" == *-* ]]; then
                      flags+=(--prerelease)
                  fi
                  gh release create "$GITHUB_REF_NAME" bin/* --verify-tag --generate-notes "${flags[@]}"
