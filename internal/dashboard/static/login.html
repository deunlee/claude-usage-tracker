<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate, max-image-preview:none">
<title>로그인 - Claude 사용량 대시보드</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-sans-kr@5.3.0/400.css" integrity="sha384-qLVaqLxeq6qZ/E40xWR0e+qVlNdUzJDclNn1c7c/YVr3Z54kjleakgc1mPj3zxsF" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-sans-kr@5.3.0/700.css" integrity="sha384-+YiOm3slC363GgffsJofnIhVIGBm3aJTyqTHhhFEfe6OEa8o8UNjaqwe/LdEU9MU" crossorigin="anonymous">
<link rel="stylesheet" href="/style.css">
<script src="/login.js" defer></script>
</head>
<body>
<main class="login">
    <form class="panel login-form" id="login-form">
        <h1>Claude 사용량 대시보드</h1>
        <input type="password" id="password" placeholder="비밀번호를 입력해 주세요" aria-label="비밀번호" autocomplete="current-password" autofocus>
        <p class="login-error" id="login-error" hidden></p>
        <button type="submit" class="login-button" id="login-button">로그인</button>
    </form>
</main>
</body>
</html>
